name: Freshtiq Pricing-Page Brand Guard
on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:
jobs:
  protect-pricing-design:
    name: Lock canonical pricing visual identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate stylesheet, palette and pricing data
        run: node qa/brand-design-guard.js
