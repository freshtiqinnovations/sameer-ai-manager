<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Illustration: chat bots connected through API integration hub to CRM, payments, sheets and calendar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061428"/><stop offset=".55" stop-color="#0a1c3a"/><stop offset="1" stop-color="#081126"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5cff"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b5cff"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <circle cx="80" cy="40" r="180" fill="url(#glow)"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <circle cx="320" cy="180" r="54" fill="url(#brand)"/>
    <g fill="#fff">
      <rect x="300" y="168" width="40" height="24" rx="7"/>
      <circle cx="296" cy="180" r="14" fill="none" stroke="#fff" stroke-width="4"/>
      <circle cx="344" cy="180" r="14" fill="none" stroke="#fff" stroke-width="4"/>
      <circle cx="308" cy="180" r="4" fill="#2563eb"/><circle cx="332" cy="180" r="4" fill="#2563eb"/>
    </g>
    <text x="320" y="262" font-size="12.5" fill="#9fb3d1" text-anchor="middle">One integration layer</text>
    <line x1="266" y1="180" x2="150" y2="106" stroke="#38bdf8" stroke-width="2.4" stroke-dasharray="6 6"/>
    <line x1="266" y1="208" x2="150" y2="270" stroke="#38bdf8" stroke-width="2.4" stroke-dasharray="6 6"/>
    <line x1="374" y1="180" x2="490" y2="106" stroke="#a78bfa" stroke-width="2.4" stroke-dasharray="6 6"/>
    <line x1="374" y1="208" x2="490" y2="270" stroke="#a78bfa" stroke-width="2.4" stroke-dasharray="6 6"/>
    <rect x="40" y="66" width="180" height="62" rx="16" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/>
    <text x="60" y="94" font-size="13.5" font-weight="700" fill="#fff">Telegram Bot</text>
    <text x="60" y="113" font-size="11.5" fill="#9fb3d1">Alerts · bookings · support</text>
    <rect x="40" y="240" width="180" height="62" rx="16" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/>
    <text x="60" y="268" font-size="13.5" font-weight="700" fill="#fff">QR / Booking</text>
    <text x="60" y="287" font-size="11.5" fill="#9fb3d1">Scan · book · confirm</text>
    <rect x="420" y="66" width="180" height="62" rx="16" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/>
    <text x="440" y="94" font-size="13.5" font-weight="700" fill="#fff">CRM / ERP</text>
    <text x="440" y="113" font-size="11.5" fill="#9fb3d1">Contacts · deals · stock</text>
    <rect x="420" y="240" width="180" height="62" rx="16" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/>
    <text x="440" y="268" font-size="13.5" font-weight="700" fill="#fff">Payments &amp; Sheets</text>
    <text x="440" y="287" font-size="11.5" fill="#9fb3d1">Tools you already use</text>  </g>
</svg>
