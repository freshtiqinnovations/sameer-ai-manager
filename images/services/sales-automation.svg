<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Illustration: lead capture funnel with automatic follow-up sequence and sales dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061428"/><stop offset=".55" stop-color="#0a1c3a"/><stop offset="1" stop-color="#081126"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5cff"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b5cff"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <circle cx="80" cy="40" r="180" fill="url(#glow)"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <path d="M70 66 L320 66 L250 150 L250 210 L200 258 L200 150 L140 150 Z" fill="url(#brand)" fill-opacity=".22" stroke="#38bdf8" stroke-opacity=".55" stroke-width="2"/>
    <text x="196" y="104" font-size="14" font-weight="700" fill="#e8f1ff" text-anchor="middle">Lead capture</text>
    <text x="222" y="140" font-size="12" fill="#9fb3d1" text-anchor="middle">Qualify</text>
    <text x="225" y="196" font-size="12" fill="#9fb3d1" text-anchor="middle">Follow-up</text>
    <rect x="180" y="278" width="40" height="20" rx="6" fill="#059669"/>
    <rect x="300" y="46" width="300" height="62" rx="16" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/>
    <circle cx="330" cy="77" r="14" fill="#25d366"/><text x="330" y="82" font-size="12" text-anchor="middle" fill="#04231a">1</text>
    <text x="356" y="74" font-size="13.5" font-weight="700" fill="#fff">Enquiry captured</text>
    <text x="356" y="92" font-size="11.5" fill="#9fb3d1">Website · WhatsApp · Ads</text>
    <rect x="300" y="122" width="300" height="62" rx="16" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/>
    <circle cx="330" cy="153" r="14" fill="#2563eb"/><text x="330" y="158" font-size="12" text-anchor="middle" fill="#fff">2</text>
    <text x="356" y="150" font-size="13.5" font-weight="700" fill="#fff">Auto follow-up in 5 min</text>
    <text x="356" y="168" font-size="11.5" fill="#9fb3d1">No lead left waiting</text>
    <rect x="300" y="198" width="300" height="62" rx="16" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".13"/>
    <circle cx="330" cy="229" r="14" fill="#7c3aed"/><text x="330" y="234" font-size="12" text-anchor="middle" fill="#fff">3</text>
    <text x="356" y="226" font-size="13.5" font-weight="700" fill="#fff">Owner alert + reminders</text>
    <text x="356" y="244" font-size="11.5" fill="#9fb3d1">Nothing slips the pipeline</text>
    <rect x="300" y="274" width="300" height="44" rx="14" fill="#fff" fill-opacity=".05"/>
    <circle cx="326" cy="296" r="7" fill="#34d399"/>
    <text x="344" y="301" font-size="12" fill="#9fb3d1">Field sales tracking + dashboard</text>  </g>
</svg>
