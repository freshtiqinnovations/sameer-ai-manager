<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Illustration: CRM pipeline board and ERP inventory/reporting dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061428"/><stop offset=".55" stop-color="#0a1c3a"/><stop offset="1" stop-color="#081126"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5cff"/><stop offset=".55" stop-color="#2563eb"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b5cff"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".5"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <circle cx="80" cy="40" r="180" fill="url(#glow)"/>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <rect x="40" y="46" width="360" height="268" rx="20" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".13"/>
    <text x="62" y="76" font-size="13.5" font-weight="700" fill="#e8f1ff">Sales pipeline</text>
    <g>
      <rect x="62" y="94" width="76" height="200" rx="12" fill="#fff" fill-opacity=".05"/>
      <text x="74" y="116" font-size="11" fill="#9fb3d1">New</text>
      <rect x="72" y="126" width="56" height="46" rx="8" fill="url(#bar)" fill-opacity=".85"/>
      <rect x="72" y="180" width="56" height="46" rx="8" fill="url(#bar)" fill-opacity=".6"/>
      <rect x="72" y="234" width="56" height="46" rx="8" fill="url(#bar)" fill-opacity=".4"/>
      <rect x="150" y="94" width="76" height="200" rx="12" fill="#fff" fill-opacity=".05"/>
      <text x="162" y="116" font-size="11" fill="#9fb3d1">Qualified</text>
      <rect x="160" y="126" width="56" height="46" rx="8" fill="url(#bar)" fill-opacity=".8"/>
      <rect x="160" y="180" width="56" height="46" rx="8" fill="url(#bar)" fill-opacity=".65"/>
      <rect x="238" y="94" width="76" height="200" rx="12" fill="#fff" fill-opacity=".05"/>
      <text x="250" y="116" font-size="11" fill="#9fb3d1">Quoted</text>
      <rect x="248" y="126" width="56" height="46" rx="8" fill="url(#bar)" fill-opacity=".75"/>
      <rect x="326" y="94" width="56" height="200" rx="12" fill="#fff" fill-opacity=".05"/>
      <text x="336" y="116" font-size="11" fill="#9fb3d1">Won</text>
      <rect x="334" y="126" width="40" height="46" rx="8" fill="#059669"/>
    </g>
    <rect x="424" y="46" width="176" height="126" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
    <text x="444" y="74" font-size="12.5" fill="#9fb3d1">Inventory</text>
    <text x="444" y="102" font-size="24" font-weight="800" fill="#fff">1,248</text>
    <rect x="444" y="118" width="120" height="9" rx="4" fill="#fff" fill-opacity=".15"/>
    <rect x="444" y="118" width="86" height="9" rx="4" fill="#38bdf8"/>
    <text x="444" y="150" font-size="11" fill="#9fb3d1">Low-stock alerts on</text>
    <rect x="424" y="188" width="176" height="126" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
    <text x="444" y="216" font-size="12.5" fill="#9fb3d1">Monthly report</text>
    <rect x="446" y="276" width="24" height="22" rx="5" fill="url(#bar)" fill-opacity=".7"/>
    <rect x="478" y="256" width="24" height="42" rx="5" fill="url(#bar)" fill-opacity=".85"/>
    <rect x="510" y="234" width="24" height="64" rx="5" fill="url(#bar)"/>
    <rect x="542" y="248" width="24" height="50" rx="5" fill="url(#bar)" fill-opacity=".8"/>  </g>
</svg>
