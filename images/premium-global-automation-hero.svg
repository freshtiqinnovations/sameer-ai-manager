<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Freshtiq global business automation platform illustration</title><desc id="desc">A premium global network with an automation command center showing enquiry capture, AI qualification, CRM routing, booking and human handoff.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020817"/><stop offset=".48" stop-color="#071a38"/><stop offset="1" stop-color="#07101f"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#0ea5e9" stop-opacity=".42"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#60a5fa" stroke-opacity=".08"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000814" flood-opacity=".55"/></filter>
</defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/><rect width="1600" height="900" rx="34" fill="url(#grid)"/><circle cx="1160" cy="260" r="430" fill="url(#glow)"/>
<!-- global network -->
<g fill="none" stroke="#38bdf8" stroke-opacity=".28" stroke-width="2">
 <path d="M830 180C1010 38 1270 62 1460 220"/><path d="M790 265C1010 120 1300 155 1490 330"/><path d="M850 360C1040 240 1275 280 1465 425"/>
 <path d="M910 160C1010 315 1205 372 1425 344"/><path d="M970 120C1110 300 1260 385 1500 390"/>
</g>
<g fill="#67e8f9" stroke="#082f49" stroke-width="5"><circle cx="895" cy="218" r="10"/><circle cx="1122" cy="150" r="10"/><circle cx="1240" cy="282" r="11"/><circle cx="1330" cy="242" r="10"/><circle cx="1428" cy="350" r="10"/></g>
