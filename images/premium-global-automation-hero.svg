<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <circle cx="280" cy="286" r="8" fill="#34d399"/><text x="304" y="294" fill="#f8fafc" font-size="25" font-weight="800">Automation Command Center</text><text x="1040" y="294" fill="#7dd3fc" font-size="17" font-weight="700">LIVE WORKFLOW DEMO</text>
