 <text x="535" y="365" fill="#94a3b8" font-size="15" font-weight="800">CUSTOMER JOURNEY</text>
 <g>
  <rect x="535" y="395" width="168" height="86" rx="18" fill="#0e2442" stroke="#38bdf8" stroke-opacity=".3"/><text x="559" y="429" fill="#7dd3fc" font-size="14" font-weight="700">ENQUIRY</text><text x="559" y="457" fill="#f8fafc" font-size="18" font-weight="800">Capture</text>
