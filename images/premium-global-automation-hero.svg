 <rect x="965" y="515" width="233" height="78" rx="17" fill="#0e223d"/><circle cx="995" cy="554" r="12" fill="#22d3ee"/><text x="1020" y="548" fill="#f8fafc" font-size="16" font-weight="800">Booking</text><text x="1020" y="570" fill="#94a3b8" font-size="13">Calendar or staff approval</text>
 <rect x="965" y="615" width="233" height="78" rx="17" fill="#0e223d"/><circle cx="995" cy="654" r="12" fill="#34d399"/><text x="1020" y="648" fill="#f8fafc" font-size="16" font-weight="800">Human Handoff</text><text x="1020" y="670" fill="#94a3b8" font-size="13">Sensitive decisions stay human</text>
</g>
