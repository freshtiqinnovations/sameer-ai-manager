<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" role="img" aria-label="Freshtiq Automation live operations dashboard: WhatsApp automation, AI agents, CRM and custom workflows for India and GCC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050f22"/>
      <stop offset="0.52" stop-color="#0a1c3a"/>
      <stop offset="1" stop-color="#081428"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5cff"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0b5cff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#7dd3fc" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#01060f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>
  <circle cx="240" cy="70" r="300" fill="url(#glowBlue)"/>
  <circle cx="1460" cy="560" r="320" fill="url(#glowViolet)"/>

  <!-- ============ LEFT: LIVE OPS DASHBOARD ============ -->
  <g filter="url(#soft)">
    <rect x="70" y="70" width="780" height="480" rx="26" fill="#ffffff" fill-opacity="0.058" stroke="#ffffff" stroke-opacity="0.15"/>
  </g>
  <circle cx="112" cy="112" r="9" fill="#ff5f57"/>
  <circle cx="138" cy="112" r="9" fill="#febc2e"/>
  <circle cx="164" cy="112" r="9" fill="#28c840"/>
  <text x="196" y="119" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e8f1ff">Freshtiq Automation · Live Operations</text>
  <line x1="98" y1="146" x2="822" y2="146" stroke="#ffffff" stroke-opacity="0.12"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <!-- KPI 1 -->
    <rect x="98" y="170" width="220" height="104" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="118" y="204" font-size="14" fill="#9fb3d1">Enquiries captured</text>
    <text x="118" y="244" font-size="30" font-weight="800" fill="#ffffff">128</text>
    <text x="118" y="264" font-size="13" fill="#34d399">+18 today</text>
    <!-- KPI 2 -->
    <rect x="350" y="170" width="220" height="104" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="370" y="204" font-size="14" fill="#9fb3d1">Qualified leads</text>
    <text x="370" y="244" font-size="30" font-weight="800" fill="#ffffff">74</text>
    <text x="370" y="264" font-size="13" fill="#34d399">58% qualify rate</text>
    <!-- KPI 3 -->
    <rect x="602" y="170" width="220" height="104" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="622" y="204" font-size="14" fill="#9fb3d1">First response</text>
    <text x="622" y="244" font-size="30" font-weight="800" fill="#ffffff">12s</text>
    <text x="622" y="264" font-size="13" fill="#38bdf8">auto, 24/7</text>

    <!-- Pipeline panel -->
    <rect x="98" y="292" width="360" height="232" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="120" y="322" font-size="14" font-weight="700" fill="#9fb3d1">Follow-up pipeline</text>
    <rect x="124" y="434" width="44" height="62" rx="8" fill="url(#barGrad)" fill-opacity="0.85"/>
    <rect x="190" y="400" width="44" height="96" rx="8" fill="url(#barGrad)" fill-opacity="0.85"/>
    <rect x="256" y="368" width="44" height="128" rx="8" fill="url(#barGrad)" fill-opacity="0.9"/>
    <rect x="322" y="348" width="44" height="148" rx="8" fill="url(#barGrad)"/>
    <rect x="388" y="388" width="44" height="108" rx="8" fill="url(#barGrad)" fill-opacity="0.85"/>
    <text x="146" y="514" font-size="11" fill="#8fa6c4" text-anchor="middle">New</text>
    <text x="212" y="514" font-size="11" fill="#8fa6c4" text-anchor="middle">Chat</text>
    <text x="278" y="514" font-size="11" fill="#8fa6c4" text-anchor="middle">Qual</text>
    <text x="344" y="514" font-size="11" fill="#8fa6c4" text-anchor="middle">Quote</text>
    <text x="410" y="514" font-size="11" fill="#8fa6c4" text-anchor="middle">Won</text>

    <!-- WhatsApp panel -->
    <rect x="478" y="292" width="344" height="232" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="500" y="322" font-size="14" font-weight="700" fill="#9fb3d1">WhatsApp auto-reply</text>
    <rect x="500" y="340" width="200" height="46" rx="14" fill="#ffffff" fill-opacity="0.10"/>
    <text x="516" y="369" font-size="13" fill="#dbeafe">Price for automation?</text>
    <rect x="604" y="398" width="200" height="46" rx="14" fill="#25d366"/>
    <text x="620" y="427" font-size="13" font-weight="600" fill="#04231a">Sharing plan in 1 min</text>
    <circle cx="512" cy="478" r="9" fill="#25d366"/>
    <path d="M507.5 478l3 3 5.5-6" fill="none" stroke="#04231a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="530" y="483" font-size="12.5" fill="#86efac">Auto-reply sent · avg 12s</text>
  </g>

  <!-- ============ RIGHT: SERVICE STACK ============ -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <!-- Chip 1 : WhatsApp -->
    <rect x="920" y="95" width="590" height="92" rx="20" fill="#ffffff" fill-opacity="0.058" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="946" y="117" width="48" height="48" rx="14" fill="#25d366"/>
    <g transform="translate(970,141) scale(1.5) translate(-12,-12)">
      <rect x="3" y="4" width="18" height="13" rx="3" fill="#04231a"/>
      <path d="M8 17l-1 3 5-3z" fill="#04231a"/>
    </g>
    <text x="1016" y="135" font-size="20" font-weight="700" fill="#ffffff">WhatsApp Automation</text>
    <text x="1016" y="161" font-size="13.5" fill="#9fb3d1">Order booking · FAQs · follow-ups</text>

    <!-- Chip 2 : AI Agents -->
    <rect x="920" y="209" width="590" height="92" rx="20" fill="#ffffff" fill-opacity="0.058" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="946" y="231" width="48" height="48" rx="14" fill="url(#brand)"/>
    <g transform="translate(970,255) scale(1.5) translate(-12,-12)">
      <rect x="4" y="8" width="16" height="11" rx="3" fill="#ffffff"/>
      <line x1="12" y1="8" x2="12" y2="5" stroke="#ffffff" stroke-width="1.6"/>
      <circle cx="12" cy="4" r="1.5" fill="#ffffff"/>
      <circle cx="9" cy="13.5" r="1.7" fill="#2563eb"/>
      <circle cx="15" cy="13.5" r="1.7" fill="#2563eb"/>
    </g>
    <text x="1016" y="249" font-size="20" font-weight="700" fill="#ffffff">AI Agents</text>
    <text x="1016" y="275" font-size="13.5" fill="#9fb3d1">Sales · support · reception</text>

    <!-- Chip 3 : CRM & ERP -->
    <rect x="920" y="323" width="590" height="92" rx="20" fill="#ffffff" fill-opacity="0.058" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="946" y="345" width="48" height="48" rx="14" fill="url(#brand)"/>
    <g transform="translate(970,369) scale(1.5) translate(-12,-12)">
      <rect x="4" y="12" width="4" height="8" rx="1.5" fill="#ffffff"/>
      <rect x="10" y="8" width="4" height="12" rx="1.5" fill="#ffffff"/>
      <rect x="16" y="5" width="4" height="15" rx="1.5" fill="#ffffff"/>
    </g>
    <text x="1016" y="363" font-size="20" font-weight="700" fill="#ffffff">CRM &amp; ERP</text>
    <text x="1016" y="389" font-size="13.5" fill="#9fb3d1">Pipeline · inventory · reporting</text>

    <!-- Chip 4 : Custom workflows -->
    <rect x="920" y="437" width="590" height="92" rx="20" fill="#ffffff" fill-opacity="0.058" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="946" y="459" width="48" height="48" rx="14" fill="#0891b2"/>
    <g transform="translate(970,483) scale(1.5) translate(-12,-12)">
      <circle cx="12" cy="12" r="3.2" fill="none" stroke="#ffffff" stroke-width="2.4"/>
      <g fill="#ffffff">
        <rect x="10.7" y="1.4" width="2.6" height="5" rx="1.2"/>
        <rect x="10.7" y="1.4" width="2.6" height="5" rx="1.2" transform="rotate(60 12 12)"/>
        <rect x="10.7" y="1.4" width="2.6" height="5" rx="1.2" transform="rotate(120 12 12)"/>
        <rect x="10.7" y="1.4" width="2.6" height="5" rx="1.2" transform="rotate(180 12 12)"/>
        <rect x="10.7" y="1.4" width="2.6" height="5" rx="1.2" transform="rotate(240 12 12)"/>
        <rect x="10.7" y="1.4" width="2.6" height="5" rx="1.2" transform="rotate(300 12 12)"/>
      </g>
    </g>
    <text x="1016" y="477" font-size="20" font-weight="700" fill="#ffffff">Custom Workflows</text>
    <text x="1016" y="503" font-size="13.5" fill="#9fb3d1">Integrates with tools you already use</text>

    <circle cx="936" cy="552" r="6" fill="#34d399"/>
    <text x="952" y="557" font-size="13.5" fill="#9fb3d1">India · Saudi Arabia · UAE · English + Arabic workflows</text>
  </g>
</svg>
